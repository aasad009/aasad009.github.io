<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="{{ '/Logo.png' | relative_url }}" />
  <link rel="apple-touch-icon" href="{{ '/Logo.png' | relative_url }}" />
  {% include seo.html %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  {% if page.layout == 'publication' %}<link rel="stylesheet" href="{{ '/assets/css/publication.css' | relative_url }}" />{% endif %}
  {% include structured-data.html %}
</head>
<body class="page-{{ page.layout | default: 'default' }}">
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
