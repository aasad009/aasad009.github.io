<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}" />
<meta name="author" content="{{ site.author.name }}" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />
<meta property="og:type" content="{% if page.layout == 'publication' %}article{% else %}website{% endif %}" />
<meta property="og:title" content="{{ page.title | default: site.title | escape }}" />
<meta property="og:description" content="{{ page.description | default: site.description | escape }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:site_name" content="{{ site.title }}" />
<meta property="og:image" content="{{ page.og_image | default: page.graphical_abstract | default: site.default_image | absolute_url }}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}" />
<meta name="twitter:description" content="{{ page.description | default: site.description | escape }}" />
<meta name="twitter:image" content="{{ page.og_image | default: page.graphical_abstract | default: site.default_image | absolute_url }}" />
<meta name="theme-color" content="#07111f" />
{% if page.layout == 'publication' %}
<meta name="citation_title" content="{{ page.title | escape }}" />
{% for author in page.authors %}<meta name="citation_author" content="{{ author }}" />{% endfor %}
<meta name="citation_publication_date" content="{{ page.year }}" />
<meta name="citation_journal_title" content="{{ page.journal | escape }}" />
<meta name="citation_doi" content="{{ page.doi }}" />
{% endif %}
