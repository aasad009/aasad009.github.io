    <path d="M126 90C108 130 109 234 132 274" fill="none" stroke="#d9f4ff" stroke-opacity=".52" stroke-width="3"/>
    <g fill="#dff7ff" opacity=".24">
      <rect x="72" y="121" width="22" height="22" rx="4"/><rect x="99" y="115" width="22" height="22" rx="4"/>
      <rect x="132" y="118" width="22" height="22" rx="4"/><rect x="160" y="130" width="22" height="22" rx="4"/>
      <rect x="68" y="151" width="22" height="22" rx="4"/><rect x="96" y="145" width="22" height="22" rx="4"/>
      <rect x="135" y="148" width="22" height="22" rx="4"/><rect x="166" y="162" width="22" height="22" rx="4"/>
      <rect x="66" y="184" width="22" height="22" rx="4"/><rect x="95" y="177" width="22" height="22" rx="4"/>
      <rect x="137" y="181" width="22" height="22" rx="4"/><rect x="165" y="194" width="22" height="22" rx="4"/>
      <rect x="75" y="217" width="22" height="22" rx="4"/><rect x="104" y="210" width="22" height="22" rx="4"/>
      <rect x="136" y="213" width="22" height="22" rx="4"/><rect x="158" y="226" width="22" height="22" rx="4"/>
    </g>
    <circle cx="114" cy="186" r="17" fill="#ffe36e" opacity=".82" filter="url(#glow)"/>
  </g>

  <!-- Module 4: uncertainty -->
  <g transform="translate(1002 62)">
    <rect width="238" height="356" rx="34" fill="#07182b" fill-opacity=".78" stroke="#75cfe0" stroke-opacity=".22"/>
    <path d="M38 286H207M45 292V62" stroke="#bad9ed" stroke-width="3" opacity=".55"/>
    <path d="M53 278C79 271 82 122 119 105C155 89 165 259 199 277"
          fill="none" stroke="#7ee0d2" stroke-width="5"/>
    <path d="M54 279C78 272 96 168 124 154C152 139 174 247 199 278"
          fill="none" stroke="#66b3ff" stroke-width="5"/>
    <path d="M54 279C75 270 91 83 129 65C165 49 178 255 201 278"
          fill="none" stroke="#89d7ff" stroke-width="4" stroke-dasharray="11 10" opacity=".8"/>
    <circle cx="124" cy="154" r="7" fill="#7ee0d2"/>
  </g>

  <!-- Module 5: constitutive model landscape -->
  <g transform="translate(1320 62)">
    <rect width="232" height="356" rx="34" fill="#07182b" fill-opacity=".78" stroke="#75cfe0" stroke-opacity=".22"/>
    <g stroke="#0b273d" stroke-width="3">
      <path d="M57 98L86 80L114 96L112 129L82 144L55 128Z" fill="#2d75ad"/>
      <path d="M112 91L142 76L169 95L166 127L137 143L111 126Z" fill="#3c9aaf"/>
      <path d="M167 101L194 88L216 108L210 138L180 151L163 129Z" fill="#4baaa3"/>
      <path d="M45 144L76 130L102 151L97 183L67 198L41 178Z" fill="#317fb1"/>
      <path d="M99 146L130 130L159 151L153 186L122 201L95 180Z" fill="#6cc0b6"/>
      <path d="M155 149L184 134L212 153L207 187L176 203L151 181Z" fill="#438cb4"/>
      <path d="M58 198L88 182L116 202L111 236L80 252L54 231Z" fill="#4c94ba"/>
      <path d="M113 202L143 185L171 205L166 240L135 256L109 235Z" fill="#7ee0d2"/>
      <path d="M169 205L199 190L220 211L213 243L183 256L164 236Z" fill="#4579a7"/>
    </g>
    <path d="M49 286C87 265 118 301 154 278C177 263 196 271 216 288"
          fill="none" stroke="#7ee0d2" stroke-width="5"/>
    <circle cx="49" cy="286" r="7" fill="#66b3ff"/>
    <circle cx="154" cy="278" r="7" fill="#ffe36e"/>
    <circle cx="216" cy="288" r="7" fill="#7ee0d2"/>
  </g>
</svg>
